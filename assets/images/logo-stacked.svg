<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 360" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <linearGradient id="stackArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="stackArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="sBar1" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#059669" /><stop offset="100%" stop-color="#2DD4BF" /></linearGradient>
    <linearGradient id="sBar2" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0891B2" /><stop offset="100%" stop-color="#06B6D4" /></linearGradient>
    <linearGradient id="sBar3" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0284C7" /><stop offset="100%" stop-color="#38BDF8" /></linearGradient>
    <linearGradient id="sBar4" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#1D4ED8" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient>
    <linearGradient id="sBar5" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#4338CA" /><stop offset="100%" stop-color="#6366F1" /></linearGradient>

    <filter id="stackGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Emblem (Top Area) -->
  <g transform="translate(170, 110)">
    <!-- Outer Dashed Orbit -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.75"/>

    <!-- Orbital Satellites -->
    <circle cx="44" cy="-44" r="4.2" fill="#38BDF8" filter="url(#stackGlow)"/>
    <circle cx="50" cy="-58" r="2.2" fill="#5EEAD4"/>
    <circle cx="58" cy="-50" r="2.6" fill="#00F0FF"/>

    <!-- Glowing Arc -->
    <path d="M 28 36 A 48 48 1 1 1 38 -32" fill="none" stroke="url(#stackArcGrad)" stroke-width="4.2" stroke-linecap="round" filter="url(#stackGlow)"/>
    <path d="M 4 48 A 48 48 0 0 0 32 34" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- 5 Vertical Growth Bars -->
    <rect x="-30" y="10" width="10" height="24" rx="5" fill="url(#sBar1)"/>
    <rect x="-17" y="-2" width="10" height="36" rx="5" fill="url(#sBar2)"/>
    <rect x="-4" y="-14" width="10" height="48" rx="5" fill="url(#sBar3)"/>
    <rect x="9" y="-26" width="10" height="60" rx="5" fill="url(#sBar4)"/>
    <rect x="22" y="-36" width="10" height="70" rx="5" fill="url(#sBar5)"/>

    <!-- Piercing Arrow -->
    <line x1="-42" y1="38" x2="44" y2="-48" stroke="url(#stackArrowGrad)" stroke-width="5" stroke-linecap="round" filter="url(#stackGlow)"/>
    <polygon points="52,-57 36,-49 42,-39" fill="#5EEAD4" filter="url(#stackGlow)"/>

    <!-- Sparks -->
    <circle cx="56" cy="-62" r="1.8" fill="#FFFFFF"/>
    <circle cx="51" cy="-68" r="1.4" fill="#00F0FF"/>
  </g>

  <!-- Centered Brand Typography (Lower Area) -->
  <g transform="translate(170, 230)">
    <!-- CURAFY -->
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" letter-spacing="-0.5">
      <tspan fill="#00F0FF" font-weight="900">C</tspan>
      <tspan fill="#FFFFFF" font-weight="800">URAFY</tspan>
    </text>

    <!-- DIGITECH Pill Badge -->
    <g transform="translate(-75, 16)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="2"/>
      <text x="75" y="19" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="800" letter-spacing="3" fill="#FFFFFF">
        DIGITECH
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" letter-spacing="3" fill="#38BDF8">
      DIGITAL GROWTH &amp; PERFORMANCE LAB
    </text>
  </g>
</svg>
