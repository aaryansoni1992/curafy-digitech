<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="favArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="favArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="fb1" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#059669" /><stop offset="100%" stop-color="#2DD4BF" /></linearGradient>
    <linearGradient id="fb2" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0891B2" /><stop offset="100%" stop-color="#06B6D4" /></linearGradient>
    <linearGradient id="fb3" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0284C7" /><stop offset="100%" stop-color="#38BDF8" /></linearGradient>
    <linearGradient id="fb4" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#1D4ED8" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient>
    <linearGradient id="fb5" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#4338CA" /><stop offset="100%" stop-color="#6366F1" /></linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="96" height="96" rx="20" fill="#0A0F1D" />

  <g transform="translate(48, 48)">
    <!-- Outer Dashed Orbit -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    <!-- Orbital Nodes -->
    <circle cx="27" cy="-27" r="3" fill="#38BDF8"/>
    <circle cx="34" cy="-32" r="1.8" fill="#00F0FF"/>

    <!-- Glowing Arc -->
    <path d="M 18 22 A 28 28 1 1 1 24 -18" fill="none" stroke="url(#favArc)" stroke-width="3" stroke-linecap="round"/>

    <!-- 5 Vertical Growth Bars -->
    <rect x="-19" y="4" width="6" height="15" rx="3" fill="url(#fb1)"/>
    <rect x="-11" y="-3" width="6" height="22" rx="3" fill="url(#fb2)"/>
    <rect x="-3" y="-10" width="6" height="29" rx="3" fill="url(#fb3)"/>
    <rect x="5" y="-17" width="6" height="36" rx="3" fill="url(#fb4)"/>
    <rect x="13" y="-23" width="6" height="42" rx="3" fill="url(#fb5)"/>

    <!-- Piercing Arrow -->
    <line x1="-26" y1="23" x2="27" y2="-29" stroke="url(#favArrow)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="32,-35 22,-29 27,-23" fill="#5EEAD4"/>
  </g>
</svg>
